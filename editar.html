<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor - Cuenca Neuquina</title>
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<header class="top">
  <div class="logo"><b>NEUQUÉN</b><small>Editor de contenido</small></div>
  <span class="guardado" id="guardado">Cargando…</span>
  <div class="acciones">
    <a class="btn" href="index.html" target="_blank">▶ Ver presentación</a>
    <button class="btn" id="b-descargar">⬇ Descargar content.json</button>
    <button class="btn" id="b-copiar">⧉ Copiar JSON</button>
    <button class="btn" id="b-importar">⬆ Importar</button>
    <button class="btn peligro" id="b-restaurar">↺ Restaurar original</button>
    <input type="file" id="archivo" accept="application/json,.json" hidden>
    <input type="file" id="archivo-img" accept="image/*" hidden>
  </div>
</header>

<div class="marco">
  <aside class="lado" id="lado"></aside>
  <main class="form" id="form"></main>
  <section class="prev">
    <div class="prev-t">Vista previa</div>
    <iframe id="prev" title="Vista previa"></iframe>
  </section>
</div>

<div class="aviso" id="aviso"></div>
<script src="js/contenido.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
